name: Publish Quantas

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: Distribution repository
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate source and release identity
        shell: bash
        run: |
          python tools/update_examples_manifest.py --check
          python tools/check_release_identity.py
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            python tools/check_release_identity.py --tag "${{ github.event.release.tag_name }}"
          fi
          ruff check src tests tools docs/tools
          mypy
          python -m compileall -q src tests tools docs/tools
          python tools/run_tests.py all -- -q
          python tools/update_examples_manifest.py --check
          python tools/check_architecture.py --root .
          python -m sphinx -E -a -b html -W --keep-going docs/source docs/_build/html
      - name: Build distributions
        run: python -m build
      - name: Check metadata and clean installation
        run: |
          python -m twine check dist/*
          python tools/check_distribution.py dist
          python tools/check_repository.py
      - uses: actions/upload-artifact@v6
        with:
          name: quantas-distributions
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/quantas
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: quantas-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quantas
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: quantas-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
